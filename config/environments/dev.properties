# Development Environment Configuration
environment=dev
protocol=https
host=jsonplaceholder.typicode.com
port=443
base_url=${protocol}://${host}
health.path=/posts
health.timeout.ms=5000
health.check.enabled=true
auto_open_reports=true

# Load profile overrides, per plan.
# Each plan ships its own defaults in test-plans/*.jmx; anything set here wins.
# Keys are <plan>.<setting> where plan is one of:
#   baseline, spike, stress, endurance, breakpoint
# Uncomment to override. Shown values match the current JMX defaults.
#baseline.target_level=50
#baseline.ramp_up=30
#baseline.steps=5
#baseline.hold_time=120
#stress.target_level=100
#stress.hold_time=300

# SLA Thresholds. A threshold of 0 disables that gate.
# p95_response_time_ms gates the 95th percentile, not the absolute maximum, so a single
# GC pause or warm-up outlier does not fail the run. max_response_time_ms is accepted as
# a legacy alias for the same gate.
p95_response_time_ms=2000
max_error_rate_percent=1.0
min_throughput_tps=2

# Metric streaming. Off by default. When enabled, samples stream to a time-series backend
# during the run so results accumulate into a trend instead of being one-off files.
# metrics.arg.* entries are passed through to the client verbatim.
#metrics.enabled=true
#metrics.classname=org.apache.jmeter.visualizers.backend.influxdb.InfluxdbBackendListenerClient
#metrics.queue.size=5000
#metrics.arg.influxdbUrl=http://localhost:8086/write?db=jmeter
#metrics.arg.application=jmeter-performance-suite

# Distributed execution. Empty means run in this JVM. When set, the plan runs on these
# jmeter-server hosts instead, and every property in this file is forwarded to them.
# One JVM tops out in the low thousands of threads; past that the generator, not the target,
# is what you are measuring.
#remote.hosts=10.0.0.1:1099,10.0.0.2:1099
#server.rmi.ssl.disable=true
