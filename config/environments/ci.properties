# CI Environment Configuration
#
# Targets the local mock server started by the workflow (scripts/mock-target.py), never a real
# or third-party host. The load here is deliberately tiny: this environment exists to prove the
# runner works end to end - engine start, property resolution, JTL parsing, SLA gates, report
# generation - not to measure performance. A shared CI runner is the wrong place to measure
# anything, so treat these numbers as a smoke signal only.
environment=ci
protocol=http
host=127.0.0.1
port=8099
health.path=/posts
health.timeout.ms=5000
health.check.enabled=true
auto_open_reports=false

# Small enough to finish in seconds.
baseline.target_level=5
baseline.ramp_up=1
baseline.steps=1
baseline.hold_time=5

# Gate on correctness, not speed: a shared runner's latency and throughput are meaningless.
p95_response_time_ms=0
max_error_rate_percent=0
min_throughput_tps=0
