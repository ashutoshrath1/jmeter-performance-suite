# Suite groupings.
#
# Plans are discovered by scanning test-plans/*.jmx - the id is the filename without the
# extension and without any trailing "-test" (so stress-test.jmx has the id "stress").
# Any discovered plan can be run directly by id without appearing here.
#
# Each entry below maps a suite name to a comma-separated, ordered list of plan ids.
# Adding a new plan means dropping in a .jmx and, if it belongs to a grouping, adding its id
# here. No code change and no rebuild.
#
# Removing the "all" entry makes it mean "every discovered plan, in id order".

all=baseline,spike,stress,endurance,breakpoint
quick=baseline
load=baseline,stress
